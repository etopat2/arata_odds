name: Arata Odds daily guidance refresh

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Advance fixture research and daily tickets
        shell: bash
        run: |
          set -euo pipefail
          oidc_response=$(curl --fail-with-body --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=arata-odds-daily")
          token=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST -H "Authorization: Bearer ${token}" \
            'https://arata-odds.etomet2patrick.chatgpt.site/api/internal/daily'
